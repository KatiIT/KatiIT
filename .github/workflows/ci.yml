name: CI/CD Build & Deploy

on:
  push:
    branches: [main, dev, bugfix]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://katiit.com
      NEXT_PUBLIC_CAL_LINK: katiit/15min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner for GHCR
        id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.meta.outputs.owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/katiit:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://katiit.com
            NEXT_PUBLIC_CAL_LINK=katiit/15min

      - name: Deploy container to Oracle Ubuntu
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ steps.meta.outputs.owner }} --password-stdin
            docker pull ghcr.io/${{ steps.meta.outputs.owner }}/katiit:latest
            docker stop katiit-web || true
            docker rm katiit-web || true
            docker run -d --name katiit-web --restart unless-stopped -p 3000:3000 ghcr.io/${{ steps.meta.outputs.owner }}/katiit:latest
            docker image prune -f
